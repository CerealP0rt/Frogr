<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Frogr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pond: #1d3a2a;
    --lily: #6fa35a;
    --lily-soft: #dcebd3;
    --sky: #eef5f3;
    --flower: #d2404d;
    --paper: #ffffff;
    --muted: #5b6f63;
    --cold: #4f86b8;
    --freezing: #7fb7d9;
    --extreme: #d2404d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sky); color: var(--pond);
    font: 16px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
  button, select { font: inherit; color: inherit; }
  button { border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer;
    font-family: "Fredoka", system-ui, sans-serif; font-weight: 500; background: var(--lily-soft); color: var(--pond); }
  :focus-visible { outline: 3px solid var(--flower); outline-offset: 2px; }

  header { max-width: 1280px; margin: 0 auto; padding: 28px 24px 8px; }
  h1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 2.4rem; line-height: 1; margin: 0;
    display: flex; align-items: center; gap: 12px; }
  .badge { width: 40px; height: 36px; background: var(--lily); clip-path: polygon(50% 0, 100% 100%, 0 100%); position: relative; flex: none; }
  .badge::after { content: ""; position: absolute; left: 50%; top: 62%; width: 12px; height: 12px;
    margin: -6px 0 0 -6px; border-radius: 50%; background: var(--flower); }
  .tally { color: var(--muted); margin: 8px 0 0; max-width: 70ch; }
  .tally strong { color: var(--pond); font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.2rem; }

  .filters { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filters select { background: var(--paper); border: 1.5px solid #c9d8cf; border-radius: 999px; padding: 7px 12px; }
  .filters .clear { background: transparent; padding: 7px 10px; text-decoration: underline; }
  .filters .note { color: var(--muted); font-size: .85rem; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 1.5px solid #c9d8cf;
    border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .toggle input { accent-color: var(--lily); width: 16px; height: 16px; margin: 0; }

  main { max-width: 1280px; margin: 0 auto; padding: 8px 24px 64px; }
  .block { margin-top: 28px; }
  .block h2 { font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 1.3rem; margin: 0 0 10px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .block h2 span { font-family: "Atkinson Hyperlegible", sans-serif; font-size: .85rem; color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: var(--paper); border-radius: 12px; overflow: hidden; padding: 0; text-align: left;
    font-family: inherit; font-weight: 400; display: block; width: 100%; }
  .card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: var(--lily-soft); }
  .card .cap { padding: 8px 10px; font-size: .82rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .num { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1rem; }
  .temp { border-radius: 999px; padding: 1px 8px; font-size: .75rem; color: #fff; background: var(--lily); }
  .temp.Cold { background: var(--cold); }
  .temp.Freezing { background: var(--freezing); color: var(--pond); }
  .temp.Extreme { background: var(--extreme); }
  .card.missing { background: transparent; border: 2px dashed #b5c9bc; }
  .card.missing .ph { aspect-ratio: 16/9; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); gap: 2px; }
  .card.missing .ph .num { font-size: 2rem; color: #9fb5a7; }
  .card.missing .ph small { font-size: .78rem; }
  .card.missing .cap { color: var(--muted); }
  .empty { background: var(--paper); border-radius: 12px; padding: 40px; text-align: center; color: var(--muted); margin-top: 24px; }

  .lightbox { position: fixed; inset: 0; background: rgba(20, 38, 28, .92); display: none;
    align-items: center; justify-content: center; flex-direction: column; padding: 20px; z-index: 20; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: min(1100px, 100%); max-height: 75vh; border-radius: 12px; background: var(--lily-soft); }
  .lb-info { color: #fff; margin-top: 14px; text-align: center; }
  .lb-info .num { font-size: 1.4rem; }
  .lb-info a { color: var(--lily-soft); font-size: .85rem; word-break: break-all; }
  .lb-nav { display: flex; gap: 10px; margin-top: 14px; }
  .lb-close { position: absolute; top: 16px; right: 16px; }

</style>
</head>
<body>

<header>
  <h1><span class="badge" aria-hidden="true"></span>Frogr</h1>
  <p class="tally"><strong id="total">0</strong> of Google's weather frog pictures found so far</p>
</header>

<div class="filters">
  <select id="fCond" aria-label="Weather"></select>
  <select id="fTime" aria-label="Time of day"></select>
  <select id="fTemp" aria-label="Temperature"></select>
  <select id="fLoc" aria-label="Location"></select>
  <label class="toggle"><input type="checkbox" id="fMissing"> Show missing froggies</label>
  <button class="clear" id="clearFilters">Show all</button>
  <span class="note" id="missingNote"></span>
</div>

<main id="gallery"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-close" id="lbClose">Close</button>
  <img id="lbImg" alt="">
  <div class="lb-info" id="lbInfo"></div>
  <div class="lb-nav">
    <button id="lbPrev">Previous</button>
    <button id="lbNext">Next</button>
  </div>
</div>

const BASE = 'https://ssl.gstatic.com/weather/froggie/v2/mobile/sm_l/';
const NAME_RE = /(\d+)_([^_\/]+)_([^_\/]+)_([^_\/]+)_([^_\/.]+)\.png/;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const items = [];
const seen = new Set();
for (let line of FROGGIES.split('\n')) {
  line = line.trim();
  if (!line) continue;
  let url = line.startsWith('http') ? line : BASE + line;
  if (!/\.png$/i.test(url)) url += '.png';
  const m = url.match(NAME_RE);
  if (!m || seen.has(url)) continue;
  seen.add(url);
  items.push({ n: parseInt(m[1], 10), cond: m[2], time: m[3], temp: m[4], loc: m[5], url });
}
items.sort((a, b) => a.n - b.n);

let filtered = [];
let lbIndex = 0;

function fillSelect(id, label, values) {
  $(id).innerHTML = `<option value="">${label}</option>` + values.map(v => `<option>${esc(v)}</option>`).join('');
}
const inOrder = key => [...new Set(items.map(x => x[key]))];
fillSelect('fCond', 'All weather', inOrder('cond'));
fillSelect('fTime', 'Day and night', inOrder('time'));
fillSelect('fTemp', 'All temperatures', inOrder('temp'));
fillSelect('fLoc', 'All locations', inOrder('loc').sort());

function predict(n) {
  let lo = null, hi = null;
  for (const x of items) {
    if (x.n < n) lo = x;
    else if (x.n > n) { hi = x; break; }
  }
  if (lo && hi && lo.cond === hi.cond && lo.time === hi.time) return { cond: lo.cond, time: lo.time, sure: true };
  if (lo && hi && lo.temp === 'Extreme' && hi.n - n <= 3) return { cond: hi.cond, time: hi.time, sure: false };
  if (lo && hi && hi.temp === 'Extreme' && hi.n - n <= 3) return { cond: hi.cond, time: hi.time, sure: false };
  return null;
}

function render() {
  $('total').textContent = items.length;
  const f = { cond: $('fCond').value, time: $('fTime').value, temp: $('fTemp').value, loc: $('fLoc').value };
  filtered = items.filter(x => (!f.cond || x.cond === f.cond) && (!f.time || x.time === f.time) &&
    (!f.temp || x.temp === f.temp) && (!f.loc || x.loc === f.loc));

  let display = filtered.map((x, i) => ({ kind: 'found', n: x.n, cond: x.cond, time: x.time, x, i }));
  const showMissing = $('fMissing').checked;
  const missingHidden = showMissing && (f.temp || f.loc);
  if (showMissing && !missingHidden) {
    const have = new Set(items.map(x => x.n));
    const max = Math.max(0, ...have);
    for (let n = 1; n <= max; n++) {
      if (have.has(n)) continue;
      const p = predict(n);
      const m = { kind: 'missing', n, cond: p ? p.cond : null, time: p ? p.time : null, sure: p ? p.sure : false };
      if (f.cond && m.cond !== f.cond) continue;
      if (f.time && m.time !== f.time) continue;
      display.push(m);
    }
    display.sort((a, b) => a.n - b.n);
  }
  $('missingNote').textContent = missingHidden ? 'Missing froggies are hidden while a temperature or location filter is on.' : '';

  if (!display.length) {
    $('gallery').innerHTML = '<div class="empty">No froggies match these filters.</div>';
    return;
  }

  const blocks = [];
  for (const d of display) {
    const key = d.cond ? d.cond + '|' + d.time : 'unknown';
    const last = blocks[blocks.length - 1];
    if (last && last.key === key) last.items.push(d);
    else blocks.push({ key, cond: d.cond, time: d.time, items: [d] });
  }

  $('gallery').innerHTML = blocks.map(b => {
    const first = b.items[0].n, lastN = b.items[b.items.length - 1].n;
    const nFound = b.items.filter(d => d.kind === 'found').length;
    const nMiss = b.items.length - nFound;
    const title = b.cond ? `${esc(b.cond.replace(/-/g, ' '))}, ${esc(b.time.toLowerCase())}` : 'Unknown weather';
    const counts = [nFound ? `${nFound} found` : '', nMiss ? `${nMiss} missing` : ''].filter(Boolean).join(', ');
    return `<section class="block">
      <h2>${title} <span>#${first}${lastN !== first ? '–' + lastN : ''}, ${counts}</span></h2>
      <div class="grid">${b.items.map(d => d.kind === 'found' ? `
        <button class="card" data-i="${d.i}">
          <img loading="lazy" src="${esc(d.x.url)}" alt="${esc(d.x.cond)} ${esc(d.x.time)}, ${esc(d.x.temp)}, ${esc(d.x.loc)}">
          <span class="cap"><span class="num">${d.x.n}</span><span class="temp ${esc(d.x.temp)}">${esc(d.x.temp)}</span>${esc(d.x.loc)}</span>
        </button>` : `
        <div class="card missing">
          <span class="ph"><span class="num">${d.n}</span><small>not found yet</small></span>
          <span class="cap">${d.cond ? (d.sure ? '' : 'probably ') + esc(d.cond.replace(/-/g, ' ')) + ', ' + esc(d.time.toLowerCase()) : 'weather unknown'}</span>
        </div>`).join('')}</div>
    </section>`;
  }).join('');
}

function openLightbox(i) {
  lbIndex = i;
  const x = filtered[i];
  if (!x) return;
  $('lbImg').src = x.url;
  $('lbImg').alt = `${x.cond} ${x.time}, ${x.temp}, ${x.loc}`;
  $('lbInfo').innerHTML = `<div><span class="num">#${x.n}</span> ${esc(x.cond.replace(/-/g, ' '))}, ${esc(x.time.toLowerCase())}, ${esc(x.temp.toLowerCase())}, ${esc(x.loc)}</div>
    <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a>
    <div style="font-size:.8rem;opacity:.8;margin-top:4px">${i + 1} of ${filtered.length}</div>`;
  $('lightbox').classList.add('open');
  $('lbClose').focus();
}
function closeLightbox() { $('lightbox').classList.remove('open'); }
function stepLightbox(d) { openLightbox((lbIndex + d + filtered.length) % filtered.length); }

$('gallery').addEventListener('click', e => {
  const card = e.target.closest('button.card');
  if (card) openLightbox(parseInt(card.dataset.i, 10));
});
$('lbClose').onclick = closeLightbox;
$('lbPrev').onclick = () => stepLightbox(-1);
$('lbNext').onclick = () => stepLightbox(1);
$('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!$('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') stepLightbox(-1);
  if (e.key === 'ArrowRight') stepLightbox(1);
});

for (const id of ['fCond', 'fTime', 'fTemp', 'fLoc']) $(id).onchange = render;
$('fMissing').onchange = () => {
  try { localStorage.setItem('frogr.showMissing', $('fMissing').checked ? '1' : ''); } catch {}
  render();
};
try { $('fMissing').checked = localStorage.getItem('frogr.showMissing') === '1'; } catch {}
$('clearFilters').onclick = () => { for (const id of ['fCond', 'fTime', 'fTemp', 'fLoc']) $(id).value = ''; render(); };

render();
</script>
